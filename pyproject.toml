[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-seo-geo"
version = "0.1.1"
description = "AI visibility toolkit. Measure and optimize how AI models see your brand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Metin Kılagöz", email = "metin@avgon.dev"},
]
keywords = ["seo", "geo", "jev", "ai-visibility", "brand-monitoring", "generative-engine-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/avgon/jev-seo-geo"
Repository = "https://github.com/avgon/jev-seo-geo"
Issues = "https://github.com/avgon/jev-seo-geo/issues"
